syntax = "proto3";

package com.remarketing.recommendation;

option java_multiple_files = true;
option java_package = "com.remarketing.recommendation.grpc";
option java_outer_classname = "RecommendationProto";

import "product.proto";

service RecommendationService {
    rpc GetRecommendations (RecommendationRequest) returns (RecommendationResponse);
}

message RecommendationRequest {
    string user_id = 1;
}

message RecommendationResponse {
    repeated com.remarketing.product.Product recommended_products = 1;
}
