syntax = "proto3";

package com.remarketing.abtesting;

option java_multiple_files = true;
option java_package = "com.remarketing.abtesting.grpc";
option java_outer_classname = "ABTestingProto";

service ABTestingService {
    rpc AssignVariant (AssignVariantRequest) returns (AssignVariantResponse);
    rpc GetTestResults (GetTestResultsRequest) returns (GetTestResultsResponse);
}

message AssignVariantRequest {
    string user_id = 1;
    string campaign_id = 2;
}

message AssignVariantResponse {
    string assignment_id = 1;
    string user_id = 2;
    string campaign_id = 3;
    string variant = 4; // "A" or "B"
    string assigned_at = 5;
    string message = 6;
}

message GetTestResultsRequest {
    string campaign_id = 1;
}

message GetTestResultsResponse {
    string campaign_id = 1;
    int32 total_participants = 2;
    int32 variant_a_count = 3;
    int32 variant_b_count = 4;
    string message = 5;
}
