syntax = "proto3";

package com.remarketing.product;

option java_multiple_files = true;
option java_package = "com.remarketing.product.grpc";
option java_outer_classname = "ProductProto";

service ProductService {
    rpc SearchProducts (SearchRequest) returns (SearchResponse);
    rpc AddProduct (AddProductRequest) returns (AddProductResponse);       // ADMIN
    rpc RemoveProduct (RemoveProductRequest) returns (RemoveProductResponse); // ADMIN
}

message SearchRequest {
    string query = 1;
    string user_id = 2;
}

message Product {
    string id = 1;
    string name = 2;
    double price = 3;
    string category = 4;
}

message SearchResponse {
    repeated Product products = 1;
}

message AddProductRequest {
    string name = 1;
    double price = 2;
    string category = 3;
}

message AddProductResponse {
    bool success = 1;
    string product_id = 2;
    string message = 3;
}

message RemoveProductRequest {
    string product_id = 1;
}

message RemoveProductResponse {
    bool success = 1;
    string message = 2;
}
